[project]
name = "assignment-2-messy-text-to-json"
version = "0.1.0"
description = "Extract structured job-post data from messy text into validated JSON using Gemini and Pydantic"
readme = "README.md"
authors = [
    { name = "iftikharalideveloper", email = "iftikharali.developer@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.6.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
